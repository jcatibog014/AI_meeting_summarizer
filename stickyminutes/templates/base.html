<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ APP_NAME }}{% endblock %}</title>
  <meta name="description" content="Sticky Minutes turns a meeting transcript into a short summary, decisions and action items, and checks every note against the transcript.">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link rel="preload" href="{{ url_for('static', filename='fonts/nunito-latin-400-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ url_for('static', filename='fonts/kalam-latin-700-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/logo.svg') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/icon-32.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <meta name="theme-color" content="#f7f3ea">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {# Before the page draws, so a saved dark theme never flashes light. #}
  <script src="{{ url_for('static', filename='theme.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% block layout %}
  <div class="app">
    {% if g.user %}{% include "_sidebar.html" %}{% endif %}
    <div class="main-column">
      <main id="main" class="page {% block page_class %}{% endblock %}">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  {% endblock %}
  {% include "_toasts.html" %}
</body>
</html>
